components:
  schemas:
    # ==================== COMMON SCHEMAS ====================
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: 'Access token is required'

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Number of items per page
          example: 10
        total_pages:
          type: integer
          description: Total number of pages
          example: 5
        total:
          type: integer
          description: Total number of items
          example: 50

components:
  schemas:
    # ==================== VIDEO STATUS SCHEMAS ====================
    VideoStatus:
      type: object
      description: Video encoding status information
      properties:
        _id:
          type: string
          description: Unique video status identifier (MongoDB ObjectId)
          example: '67f1f77bcf86cd799439044'
        name:
          type: string
          description: Video name identifier
          example: '69e24855889b96b20a0621f4'
        status:
          type: integer
          enum: [0, 1, 2, 3]
          description: 'Encoding status: 0=Pending, 1=Processing, 2=Success, 3=Failed'
          example: 2
        message:
          type: string
          description: Status message or error description
          example: 'Success'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the video was uploaded
          example: '2024-01-15T10:30:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the status was last updated
          example: '2024-01-15T10:35:00.000Z'

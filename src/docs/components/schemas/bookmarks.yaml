components:
  schemas:
    # ==================== BOOKMARK SCHEMAS ====================
    Bookmark:
      type: object
      description: Bookmark document information
      properties:
        _id:
          type: string
          description: Unique bookmark identifier (MongoDB ObjectId)
          example: '67f1f77bcf86cd799439033'
        user_id:
          type: string
          description: The user who bookmarked the tweet
          example: '69e24855889b96b20a0621f4'
        tweet_id:
          type: string
          description: The bookmarked tweet ID
          example: '69e24855889b96b20a0621f5'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the bookmark was created
          example: '2024-01-15T10:30:00.000Z'

/search:
  get:
    tags:
      - Search
    summary: Search tweets
    description: |
      Search for tweets by content. The search query should be URL-encoded.
      Returns paginated results matching the search query.
      Requires a valid access token.
    operationId: searchTweets
    security:
      - bearerAuth: []
    parameters:
      - name: content
        in: query
        required: true
        description: Search query (URL-encoded)
        schema:
          type: string
          example: 'hello'
      - name: page
        in: query
        required: false
        description: Page number for pagination
        schema:
          type: integer
          default: 1
          minimum: 1
          example: 1
      - name: limit
        in: query
        required: false
        description: Number of tweets per page (1-100)
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
          example: 10
    responses:
      '200':
        description: Search results retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Search successfully'
                result:
                  type: object
                  properties:
                    tweets:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tweet'
                    limit:
                      type: integer
                      example: 10
                    page:
                      type: integer
                      example: 1
                    total_page:
                      type: integer
                      example: 5
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'

/users/register:
  post:
    tags:
      - Users
    summary: Register a new user
    description: |
      Create a new user account. An verification email will be sent to the provided email address.
      The user must verify their email before accessing protected endpoints.
    operationId: registerUser
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
          example:
            name: 'John Doe'
            email: 'john@example.com'
            password: 'SecurePass123!'
            confirm_password: 'SecurePass123!'
            date_of_birth: '1990-01-15'
    responses:
      '201':
        description: User registered successfully. Verification email sent.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Register successfully'
                result:
                  type: object
                  properties:
                    access_token:
                      type: string
                      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                    refresh_token:
                      type: string
                      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      '400':
        $ref: '#/components/responses/BadRequest'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'

/users/login:
  post:
    tags:
      - Users
    summary: Login user
    description: |
      Authenticate a user and return access and refresh tokens.
      The access token is required for accessing protected endpoints.
    operationId: loginUser
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
          example:
            email: 'john@example.com'
            password: 'SecurePass123!'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokensResponse'
      '400':
        $ref: '#/components/responses/BadRequest'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'

/users/logout:
  post:
    tags:
      - Users
    summary: Logout user
    description: |
      Invalidate the user's refresh token and log them out.
      The access token must be provided in the Authorization header.
    operationId: logoutUser
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LogoutRequest'
          example:
            refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Logout successfully'
      '401':
        $ref: '#/components/responses/Unauthorized'

/users/refresh-token:
  post:
    tags:
      - Users
    summary: Refresh access token
    description: |
      Get a new access token using a valid refresh token.
      The refresh token is obtained during login or registration.
    operationId: refreshToken
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'
          example:
            refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    responses:
      '200':
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Refresh token successfully'
                result:
                  type: object
                  properties:
                    access_token:
                      type: string
                      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                    refresh_token:
                      type: string
                      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      '401':
        $ref: '#/components/responses/Unauthorized'

/users/verify-email:
  post:
    tags:
      - Users
    summary: Verify email address
    description: |
      Verify user's email address using the verification token sent to their email.
      Upon successful verification, the user's account status is updated to verified.
    operationId: verifyEmail
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerifyEmailRequest'
          example:
            email_verify_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    responses:
      '200':
        description: Email verified successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Email verified successfully'
      '400':
        $ref: '#/components/responses/BadRequest'

/users/resend-verify-email:
  post:
    tags:
      - Users
    summary: Resend verification email
    description: |
      Resend the email verification link to the user's email address.
      The user must be logged in to request a new verification email.
    operationId: resendVerifyEmail
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Verification email sent
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Resend verify email successfully'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

/users/forgot-password:
  post:
    tags:
      - Users
    summary: Request password reset
    description: |
      Submit an email address to request a password reset.
      If the email exists, a reset link will be sent to the user's email.
    operationId: forgotPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgotPasswordRequest'
          example:
            email: 'john@example.com'
    responses:
      '200':
        description: Password reset email sent
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Check your email to reset password'
      '400':
        $ref: '#/components/responses/BadRequest'

/users/verify-forgot-password:
  post:
    tags:
      - Users
    summary: Verify forgot password token
    description: |
      Verify the forgot password token from the reset email link.
      This endpoint validates that the token is valid and not expired.
    operationId: verifyForgotPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerifyForgotPasswordRequest'
          example:
            forgot_password_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    responses:
      '200':
        description: Token verified successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Verify forgot password token successfully'
      '400':
        $ref: '#/components/responses/BadRequest'

/users/reset-password:
  post:
    tags:
      - Users
    summary: Reset password
    description: |
      Reset the user's password using the forgot password token.
      The token must be verified first using the verify-forgot-password endpoint.
    operationId: resetPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetPasswordRequest'
          example:
            password: 'NewSecurePass123!'
            confirm_password: 'NewSecurePass123!'
            forgot_password_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    responses:
      '200':
        description: Password reset successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Reset password successfully'
      '400':
        $ref: '#/components/responses/BadRequest'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'

/users/me:
  get:
    tags:
      - Users
    summary: Get current user profile
    description: |
      Get the profile of the currently authenticated user.
      Requires a valid access token.
    operationId: getMe
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

  patch:
    tags:
      - Users
    summary: Update current user profile
    description: |
      Update the profile of the currently authenticated user.
      All fields are optional. Only provided fields will be updated.
    operationId: updateMe
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateMeReqBody'
          example:
            name: 'John Doe'
            bio: 'Software Developer | Coffee Enthusiast'
            location: 'San Francisco, CA'
            website: 'https://johndoe.dev'
    responses:
      '200':
        description: Profile updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'

/users/follow/{user_id}:
  post:
    tags:
      - Users
    summary: Follow a user
    description: |
      Follow another user by their user ID.
      The authenticated user will start following the target user.
    operationId: followUser
    security:
      - bearerAuth: []
    parameters:
      - name: user_id
        in: path
        required: true
        description: The unique identifier of the user to follow
        schema:
          type: string
          example: '69e24855889b96b20a0621f4'
    responses:
      '200':
        description: User followed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Follow successfully'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Users
    summary: Unfollow a user
    description: |
      Unfollow a user by their user ID.
      The authenticated user will stop following the target user.
    operationId: unfollowUser
    security:
      - bearerAuth: []
    parameters:
      - name: user_id
        in: path
        required: true
        description: The unique identifier of the user to unfollow
        schema:
          type: string
          example: '69e24855889b96b20a0621f4'
    responses:
      '200':
        description: User unfollowed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Unfollow successfully'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

/users/change-password:
  patch:
    tags:
      - Users
    summary: Change password
    description: |
      Change the authenticated user's password.
      Requires the current password for verification.
    operationId: changePassword
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangePasswordRequest'
          example:
            old_password: 'OldPassword123!'
            password: 'NewSecurePass123!'
            confirm_password: 'NewSecurePass123!'
    responses:
      '200':
        description: Password changed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Change password successfully'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
